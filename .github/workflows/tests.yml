name: Python tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q

  scaffold-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create React TS with Vite
        run: |
          npx --yes create-vite@latest vite-smoke --template react-ts --no-interactive
          test -f vite-smoke/package.json
          cd vite-smoke
          npm install --no-audit --no-fund
          test -d node_modules
          npm run build
      - name: Create React Native TS scaffold with Expo
        run: |
          npx --yes create-expo-app@latest expo-smoke --template blank-typescript --yes --no-install
          test -f expo-smoke/package.json
          test -f expo-smoke/tsconfig.json
